# .github/workflows/ci.yml
# SightMate-AI-Assistant CI/CD Pipeline
#
# Workflows performed:
#   1. Validates presence of core asset model files (YOLOv8n-INT8, labels).
#   2. Validates presence of optional PaddleOCR model files (issues warning on missing).
#   3. Installs Java 17 (Zulu distribution).
#   4. Installs Android SDK Command-line Tools.
#   5. Installs the exact Android NDK (25.1.8937393) and CMake (3.22.1)
#      required by the CMake native build step.
#   6. Caches Flutter SDK, Gradle dependencies, and Pub package cache.
#   7. Installs pub dependencies and runs static analysis.
#   8. Compiles the debug APK.
#   9. Uploads the build output as a GitHub runner artifact.

name: SightMate CI/CD Pipeline

on:
  push:
    branches: [ '**' ] # Run automatically on pushes to ALL branches (including feature/*)
  pull_request:
    branches: [ main, master ] # Keep support for PRs targeting main and master
  workflow_dispatch: # Enable manual triggers from GitHub Actions UI

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout Source Code ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Validate Project Asset Dependencies ──────────────────────────────
      # Ensure required model assets are committed, and warn on missing optional PaddleOCR models.
      - name: Validate Model and Asset Dependencies
        run: |
          echo "=========================================================="
          echo "Checking for required ML model files..."
          echo "=========================================================="
          
          MISSING=0
          
          # Core YOLO Obstacle Detection Model Validation (Required)
          if [ ! -f "assets/models/yolov8n_320_int8.tflite" ]; then
            echo "::error::[MISSING ASSET] assets/models/yolov8n_320_int8.tflite is missing."
            echo "Module Dependency: Module 1 (Reactive Edge Vision Pipeline)."
            echo "Description: Quantized INT8 YOLOv8n model required for on-device obstacle detection."
            echo "Resolution: Download 'yolov8n_320_int8.tflite' and place it in the 'assets/models/' folder."
            MISSING=1
          fi

          if [ ! -f "assets/models/labels.txt" ]; then
            echo "::error::[MISSING ASSET] assets/models/labels.txt is missing."
            echo "Module Dependency: Module 1 (Reactive Edge Vision Pipeline)."
            echo "Description: Contains the classification labels mapped to YOLOv8n outputs."
            echo "Resolution: Create or place 'labels.txt' inside the 'assets/models/' folder."
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo "Build terminated: Required core vision model files are missing from the repository."
            exit 1
          fi
          
          echo "All required models and metadata labels are present."

          echo "=========================================================="
          echo "Checking for optional PaddleOCR model files..."
          echo "=========================================================="
          
          MISSING_PADDLE=0
          
          # PaddleOCR Model Suite Validation (Optional, fallback to ML Kit is supported)
          if [ ! -f "assets/models/ch_PP-OCRv4_det_infer.onnx" ]; then
            echo "::warning::[OPTIONAL ASSET MISSING] assets/models/ch_PP-OCRv4_det_infer.onnx is missing."
            echo "Module Dependency: Module 2 (PaddleOCR Screen Reader DBNet text region detector)."
            echo "Description: ONNX model for text detection. If missing, the app will fall back to Google MLKit Text Recognition."
            echo "Resolution: Download 'ch_PP-OCRv4_det_infer.onnx' from the PaddleOCR model zoo and place it in 'assets/models/'."
            MISSING_PADDLE=1
          fi
          
          if [ ! -f "assets/models/ch_PP-OCRv4_rec_infer.onnx" ]; then
            echo "::warning::[OPTIONAL ASSET MISSING] assets/models/ch_PP-OCRv4_rec_infer.onnx is missing."
            echo "Module Dependency: Module 2 (PaddleOCR Screen Reader CRNN text recognizer)."
            echo "Description: ONNX model for text recognition. If missing, the app will fall back to Google MLKit Text Recognition."
            echo "Resolution: Download 'ch_PP-OCRv4_rec_infer.onnx' from the PaddleOCR model zoo and place it in 'assets/models/'."
            MISSING_PADDLE=1
          fi
          
          if [ ! -f "assets/models/ppocr_keys_v1.txt" ]; then
            echo "::warning::[OPTIONAL ASSET MISSING] assets/models/ppocr_keys_v1.txt is missing."
            echo "Module Dependency: Module 2 (PaddleOCR character vocabulary map)."
            echo "Description: Contains character mapping keys for the CRNN recognizer output. If missing, the app will fall back to Google MLKit Text Recognition."
            echo "Resolution: Download or create 'ppocr_keys_v1.txt' containing the character list and place it in 'assets/models/'."
            MISSING_PADDLE=1
          fi

          if [ $MISSING_PADDLE -eq 1 ]; then
            echo "PaddleOCR assets are missing. The application will build successfully and fall back to Google ML Kit Text Recognition at runtime."
          else
            echo "All optional PaddleOCR model files are present."
          fi

      # ── 3. Configure Java Environment ───────────────────────────────────────
      # Java 21 is required by modern Gradle and project configurations.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ── 4. Configure Android SDK & NDK ──────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Install exact CMake and NDK versions specified in build.gradle.kts
      - name: Install Android NDK and CMake
        run: |
          echo "=========================================================="
          echo "Installing NDK (28.2.13676358) & CMake (3.22.1)..."
          echo "=========================================================="
          
          # Accept licenses and install native compilation tools via sdkmanager
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"
          
          echo "NDK and CMake installations complete."

      # ── 5. Set up Flutter Environment ───────────────────────────────────────
      # Pinned to Flutter 3.32.0 to satisfy google_mlkit_translation requirements (Dart SDK >=3.8.0)
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      # ── 6. Cache Pub Cache Dependencies ─────────────────────────────────────
      - name: Cache Dart Pub Cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      # ── 7. Restore Gradle Dependencies ──────────────────────────────────────
      # Automatically caches wrapper, dependencies, and configuration steps.
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      # ── 8. Install Project Dependencies ─────────────────────────────────────
      - name: Install Flutter Dependencies
        run: flutter pub get

      # ── 9. Run Static Analysis ──────────────────────────────────────────────
      - name: Run Flutter Analyze
        run: flutter analyze 2>&1 | tee analyze_log.txt

      - name: Parse and Annotate Analyze Errors
        if: failure()
        run: |
          if [ -f analyze_log.txt ]; then
            echo "=========================================================="
            echo "Printing static analysis log..."
            echo "=========================================================="
            cat analyze_log.txt
            echo "=========================================================="
            echo "Generating error annotations..."
            echo "=========================================================="
            grep -i -E "error|warning" analyze_log.txt | head -n 30 | while read -r line; do
              echo "::error::$line"
            done
          fi

      # ── 10. Build Debug Application ──────────────────────────────────────────
      # Compiles Flutter Dart and triggers native CMake C++ compilation.
      - name: Build Debug Android APK
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build_log.txt

      - name: Verify and Parse Build Results
        if: always()
        run: |
          if [ ! -f build_log.txt ]; then
            echo "::error::build_log.txt not found!"
            exit 1
          fi
          
          # Check if APK exists
          apk_path=$(find build/app/outputs -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$apk_path" ]; then
            echo "::notice::Successfully compiled APK at $apk_path"
          else
            echo "::error::No APK file found! Running diagnostics parser..."
            
            python3 -c "
            import re
            try:
                with open('build_log.txt', 'r', encoding='utf-8', errors='ignore') as f:
                    log = f.read()
                
                # Check for compiler errors (Java, Kotlin, C++)
                compiler_errors = re.findall(r'(?:[a-zA-Z0-9_./+-]+:\d+:\d+: error:.*|e: .*|error:.*)', log)
                if compiler_errors:
                    print('::error::--- COMPILER ERRORS ---')
                    for err in compiler_errors[:30]:
                        print(f'::error::{err}')
                
                # Check for Gradle what went wrong section
                what_went_wrong = re.findall(r'\* What went wrong:\n(.*?)(?=\n\* Try:|\Z)', log, re.DOTALL)
                if what_went_wrong:
                    print('::error::--- WHAT WENT WRONG ---')
                    for line in what_went_wrong[0].strip().splitlines():
                        print(f'::error::{line}')
                
                # Check for Caused by exception lines
                caused_by = re.findall(r'Caused by:.*', log)
                if caused_by:
                    print('::error::--- CAUSED BY ---')
                    for cb in caused_by[:15]:
                        print(f'::error::{cb}')
                        
                if not compiler_errors and not what_went_wrong and not caused_by:
                    print('::warning::Could not find specific compiler/Gradle error markers. Printing last 200 lines:')
                    lines = log.splitlines()
                    for line in lines[-200:]:
                        print(f'::warning::{line}')
            except Exception as e:
                print(f'::error::Error parsing log: {e}')
            "
            exit 1
          fi

      # ── 11. Upload Compiled APK Artifact ────────────────────────────────────
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SightMate-Debug-APK
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
