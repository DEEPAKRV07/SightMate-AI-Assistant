name: sightmate
description: "SightMate – AI Assistant for the Visually Impaired"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Core ───────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Camera: startImageStream for 30 FPS pipeline ────────────────────────────
  camera: ^0.10.5+9

  # ── TFLite: YOLOv8n INT8 inference (retained, no migration) ─────────────────
  tflite_flutter: ^0.12.1

  # ── Image processing (YUV→RGB, resize, crop) ────────────────────────────────
  image: ^4.1.7

  # ── TTS: human-like pacing engine ───────────────────────────────────────────
  flutter_tts: ^3.8.5

  # ── STT: voice command input ──────────────────────────────────────────────────
  speech_to_text: ^7.3.0

  # ── OCR: MLKit fallback (primary is native PaddleOCR via ONNX) ──────────────
  google_mlkit_text_recognition: ^0.15.1

  # ── Translation ───────────────────────────────────────────────────────────────
  google_mlkit_translation: ^0.13.1

  # ── Permissions ───────────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Audio feedback ────────────────────────────────────────────────────────────
  audioplayers: ^5.2.1

  # ── System utilities ──────────────────────────────────────────────────────────
  battery_plus: ^7.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # ── AI Models ──────────────────────────────────────────────────────────────
    - assets/models/yolov8n_320_int8.tflite
    - assets/models/labels.txt
    # PaddleOCR ONNX models — add when available:
    # - assets/models/ch_PP-OCRv4_det_infer.onnx
    # - assets/models/ch_PP-OCRv4_rec_infer.onnx

    # ── Sounds ─────────────────────────────────────────────────────────────────
    - assets/sounds/beep.mp3

    # ── Icons ──────────────────────────────────────────────────────────────────
    - assets/icons/sightmate_icon.png